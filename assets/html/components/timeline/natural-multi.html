<style>
  .timeline-natural { --timeline-natural-ink: #33272a; --timeline-natural-accent: #ff8ba7; --timeline-natural-soft: #ffc6c7; --timeline-natural-mint: #c3f0ca; color: var(--timeline-natural-ink); font-family: system-ui, sans-serif; }
  .timeline-natural__list { display: flex; gap: 1rem; margin: 0; padding: 0; list-style: none; }
  .timeline-natural__item { position: relative; flex: 1 1 0; min-width: 0; padding-top: 4rem; }
  .timeline-natural__item::before { content: ''; position: absolute; top: 1.1rem; left: 1rem; width: 1.8rem; height: 1.8rem; border: 2px solid var(--timeline-natural-ink); border-radius: 50%; background: var(--timeline-natural-accent); }
  .timeline-natural__item::after { content: ''; position: absolute; top: 2rem; left: 3rem; right: -1rem; border-top: 2px dashed var(--timeline-natural-ink); }
  .timeline-natural__item:last-child::after { display: none; }
  .timeline-natural__item:nth-child(even) { padding-top: 5.5rem; }
  .timeline-natural__card { height: 100%; min-height: 10rem; padding: 1rem; border: 2px solid var(--timeline-natural-ink); border-radius: .7rem; background: var(--timeline-natural-surface, #fff8f4); }
  .timeline-natural__item:nth-child(2n) .timeline-natural__card { background: var(--timeline-natural-mint); }
  .timeline-natural__item:nth-child(3n) .timeline-natural__card { background: var(--timeline-natural-soft); }
  .timeline-natural__date { display: block; margin-bottom: .5rem; font-weight: 800; font-size: 1rem; }
  .timeline-natural__title { margin: 0; font-size: clamp(1.2rem, 1.8vw, 1.6rem); font-weight: 800; line-height: 1.25; }
  .timeline-natural__text { margin: .45rem 0 0; font-size: clamp(1rem, 1.4vw, 1.25rem); line-height: 1.5; }
  @media (max-width: 44rem) {
    .timeline-natural__list { display: block; padding-left: 2.7rem; }
    .timeline-natural__item, .timeline-natural__item:nth-child(even) { padding: 0 0 1rem; }
    .timeline-natural__item::before { left: -2.7rem; top: .7rem; width: 1.4rem; height: 1.4rem; }
    .timeline-natural__item::after { top: 2.3rem; bottom: -.7rem; left: -1.95rem; right: auto; border-top: 0; border-left: 2px dashed var(--timeline-natural-ink); }
    .timeline-natural__card { min-height: 0; }
  }
</style>

<div class="timeline-natural">
  <ol class="timeline-natural__list" aria-label="项目进程示例">
    <li class="timeline-natural__item"><div class="timeline-natural__card"><span class="timeline-natural__date">3 月</span><h3 class="timeline-natural__title">明确问题</h3><p class="timeline-natural__text">整理需求与研究范围。</p></div></li>
    <li class="timeline-natural__item"><div class="timeline-natural__card"><span class="timeline-natural__date">4 月</span><h3 class="timeline-natural__title">构思方案</h3><p class="timeline-natural__text">比较思路，确定方向。</p></div></li>
    <li class="timeline-natural__item"><div class="timeline-natural__card"><span class="timeline-natural__date">5 月</span><h3 class="timeline-natural__title">制作验证</h3><p class="timeline-natural__text">完成原型，收集反馈。</p></div></li>
    <li class="timeline-natural__item"><div class="timeline-natural__card"><span class="timeline-natural__date">6 月</span><h3 class="timeline-natural__title">整理成果</h3><p class="timeline-natural__text">归纳结果，准备展示。</p></div></li>
  </ol>
</div>

<script>
  function animateTimelineNatural(timeline, root, position) {
    timeline.from(root.querySelectorAll('.timeline-natural__item'), { autoAlpha: 0, scale: 0.95, stagger: 0.13, duration: 0.5, ease: 'back.out(1.3)' }, position);
  }
</script>
