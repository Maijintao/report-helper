<style>
  .doodle-callout {
    --callout-color: #d46a4c;
    display: inline-grid;
    grid-template-columns: 58px auto;
    align-items: start;
    gap: 4px;
    max-width: 100%;
    color: var(--callout-color);
    font: 600 18px/1.35 system-ui, 'PingFang SC', sans-serif;
  }
  .doodle-callout__arrow { display: block; width: 58px; height: 65px; margin-top: 12px; overflow: visible; }
  .doodle-callout__arrow path { fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
  .doodle-callout__label { padding: .3em .12em; overflow-wrap: anywhere; }
  .doodle-callout--right { grid-template-columns: auto 58px; }
  .doodle-callout--right .doodle-callout__arrow { grid-column: 2; grid-row: 1; transform: scaleX(-1); }
  .doodle-callout--right .doodle-callout__label { grid-column: 1; grid-row: 1; }
</style>

  </svg>
  <span class="doodle-callout__label">在这里添加说明</span>
</span>
