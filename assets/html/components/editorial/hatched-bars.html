<svg style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none" aria-hidden="true">
  <defs>
    <filter id="chalk-texture" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <pattern id="hatch-red" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#E05A47" stroke-width="2.4" stroke-opacity="0.78" />
    </pattern>
    <pattern id="hatch-blue" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2B5B84" stroke-width="2.4" stroke-opacity="0.72" />
    </pattern>
    <pattern id="hatch-yellow" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#F4C430" stroke-width="3" stroke-opacity="0.82" />
    </pattern>
  </defs>
</svg>

<style>
  .hatched-bars {
    --ed-ink: #1C1A17;
    --ed-tinted: #F3EFE6;
    --ed-red: #E05A47;
    --ed-blue: #2B5B84;
    display: grid;
    gap: 18px;
    color: var(--ed-ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }
  .hatched-bars__head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; font-size: 14px; }
  .hatched-bars__val { font-family: ui-monospace, Menlo, monospace; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hatched-bars__svg { width: 100%; height: 28px; display: block; overflow: visible; }
  .hatched-bars__stamp {
    display: inline-block;
    justify-self: end;
    padding: 2px 10px;
    border: 1.5px solid var(--ed-red);
    color: var(--ed-red);
    font-family: ui-monospace, Menlo, monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    transform: rotate(-2.5deg);
    border-radius: 2px;
  }
</style>

<div class="hatched-bars" aria-label="斜纹排线对比进度条示例">
  <span class="hatched-bars__stamp">VERIFIED · 已验收</span>
  <div class="hatched-bars__item">
    <div class="hatched-bars__head"><strong>视觉焦点清晰度（评委盲测）</strong><span class="hatched-bars__val" style="color:var(--ed-red)">92 / 100</span></div>
    <svg class="hatched-bars__svg" viewBox="0 0 420 28" preserveAspectRatio="none">
      <rect x="4" y="4" width="412" height="20" rx="3" fill="var(--ed-tinted)" stroke="var(--ed-ink)" stroke-width="1.3" filter="url(#chalk-texture)" />
      <rect class="hatched-bars__fill" x="5" y="5" width="378" height="18" rx="2" fill="url(#hatch-red)" />
    </svg>
  </div>
  <div class="hatched-bars__item">
    <div class="hatched-bars__head"><strong>组件跨风格复用率</strong><span class="hatched-bars__val" style="color:var(--ed-blue)">86 / 100</span></div>
    <svg class="hatched-bars__svg" viewBox="0 0 420 28" preserveAspectRatio="none">
      <rect x="4" y="4" width="412" height="20" rx="3" fill="var(--ed-tinted)" stroke="var(--ed-ink)" stroke-width="1.3" filter="url(#chalk-texture)" />
      <rect class="hatched-bars__fill" x="5" y="5" width="354" height="18" rx="2" fill="url(#hatch-blue)" />
    </svg>
  </div>
  <div class="hatched-bars__item">
    <div class="hatched-bars__head"><strong>离线单文件体积压缩目标</strong><span class="hatched-bars__val">74 / 100</span></div>
    <svg class="hatched-bars__svg" viewBox="0 0 420 28" preserveAspectRatio="none">
      <rect x="4" y="4" width="412" height="20" rx="3" fill="var(--ed-tinted)" stroke="var(--ed-ink)" stroke-width="1.3" filter="url(#chalk-texture)" />
      <rect class="hatched-bars__fill" x="5" y="5" width="305" height="18" rx="2" fill="url(#hatch-yellow)" />
    </svg>
  </div>
</div>

<script>
  function animateHatchedBars(timeline, root, position) {
    timeline.from(root.querySelectorAll('.hatched-bars__item'), { autoAlpha: 0, y: 12, stagger: 0.1, duration: 0.4, ease: 'power2.out' }, position);
    timeline.from(root.querySelectorAll('.hatched-bars__fill'), { scaleX: 0, transformOrigin: '0% 50%', stagger: 0.1, duration: 0.65, ease: 'power2.out' }, '-=0.3');
  }
</script>
