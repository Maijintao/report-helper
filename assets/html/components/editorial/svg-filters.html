<!-- 全局隐藏 SVG 视觉引擎字典：放进汇报页 <body> 顶部，供所有杂志手绘组件复用 -->
<svg style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none" aria-hidden="true">
  <defs>
    <!-- 粉笔/粗糙手绘笔触滤镜 -->
    <filter id="chalk-texture" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- 柔和浮层阴影滤镜 -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1C1A17" flood-opacity="0.12" />
    </filter>

    <!-- 极细微纸面纤维肌理 -->
    <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch" />
    </filter>

    <!-- 45° 斜纹排线填充 -->
    <pattern id="hatch-red" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="var(--red, #E05A47)" stroke-width="2.4" stroke-opacity="0.78" />
    </pattern>
    <pattern id="hatch-blue" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="var(--blue, #2B5B84)" stroke-width="2.4" stroke-opacity="0.72" />
    </pattern>
    <pattern id="hatch-yellow" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="var(--yellow, #F4C430)" stroke-width="3" stroke-opacity="0.82" />
    </pattern>
  </defs>
</svg>
