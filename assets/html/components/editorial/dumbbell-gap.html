<svg style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none" aria-hidden="true">
  <defs>
    <filter id="chalk-texture" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
</svg>

<style>
  .dumbbell-gap {
    --ed-bg: #FAF9F6;
    --ed-ink: #1C1A17;
    --ed-secondary: #565047;
    --ed-muted: #867E73;
    --ed-rule: rgba(28, 26, 23, 0.14);
    --ed-red: #E05A47;
    --ed-blue: #2B5B84;
    color: var(--ed-ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }
  .dumbbell-gap__svg { width: 100%; height: auto; display: block; }
  .dumbbell-gap__row { cursor: pointer; transition: opacity 0.2s ease; }
  .dumbbell-gap__svg:hover .dumbbell-gap__row { opacity: 0.4; }
  .dumbbell-gap__svg:hover .dumbbell-gap__row:hover { opacity: 1; }
</style>

<figure class="dumbbell-gap" style="margin:0">
  <svg class="dumbbell-gap__svg" viewBox="0 0 480 246" role="img" aria-label="优化前后耗时差距哑铃图示例">
    <circle cx="152" cy="18" r="5.5" fill="var(--ed-bg)" stroke="var(--ed-muted)" stroke-width="2" />
    <text x="164" y="22" font-size="11.5" fill="var(--ed-muted)" font-family="ui-monospace, Menlo, monospace">旧流程耗时</text>
    <circle cx="258" cy="18" r="6" fill="var(--ed-blue)" />
    <text x="270" y="22" font-size="11.5" fill="var(--ed-ink)" font-family="ui-monospace, Menlo, monospace" font-weight="600">新引擎耗时</text>

    <line x1="150" y1="36" x2="150" y2="232" stroke="var(--ed-rule)" stroke-dasharray="3 4" />
    <line x1="250" y1="36" x2="250" y2="232" stroke="var(--ed-rule)" stroke-dasharray="3 4" />
    <line x1="350" y1="36" x2="350" y2="232" stroke="var(--ed-rule)" stroke-dasharray="3 4" />
    <line x1="450" y1="36" x2="450" y2="232" stroke="var(--ed-rule)" stroke-dasharray="3 4" />

    <g class="dumbbell-gap__row">
      <text x="136" y="72" text-anchor="end" font-size="13.5" fill="var(--ed-ink)" font-weight="600">页面排版与配图</text>
      <path class="draw-stroke" d="M 196 68 Q 310 65, 428 68" fill="none" stroke="var(--ed-red)" stroke-width="3" stroke-linecap="round" filter="url(#chalk-texture)" />
      <circle cx="428" cy="68" r="6.5" fill="var(--ed-bg)" stroke="var(--ed-muted)" stroke-width="2.2" />
      <circle cx="196" cy="68" r="7.5" fill="var(--ed-red)" />
      <text x="440" y="72" font-size="11.5" fill="var(--ed-muted)" font-family="ui-monospace, Menlo, monospace">140m</text>
      <text x="196" y="54" text-anchor="middle" font-size="11.5" fill="var(--ed-red)" font-family="ui-monospace, Menlo, monospace" font-weight="700">23m (-84%)</text>
    </g>
    <g class="dumbbell-gap__row">
      <text x="136" y="122" text-anchor="end" font-size="13.5" fill="var(--ed-secondary)">逐字稿与页码对齐</text>
      <path class="draw-stroke" d="M 182 118 Q 275 116, 368 118" fill="none" stroke="var(--ed-blue)" stroke-width="2.6" stroke-linecap="round" filter="url(#chalk-texture)" />
      <circle cx="368" cy="118" r="6" fill="var(--ed-bg)" stroke="var(--ed-muted)" stroke-width="2" />
      <circle cx="182" cy="118" r="6.5" fill="var(--ed-blue)" />
      <text x="380" y="122" font-size="11.5" fill="var(--ed-muted)" font-family="ui-monospace, Menlo, monospace">110m</text>
      <text x="182" y="104" text-anchor="middle" font-size="11" fill="var(--ed-blue)" font-family="ui-monospace, Menlo, monospace" font-weight="700">16m</text>
    </g>
    <g class="dumbbell-gap__row">
      <text x="136" y="172" text-anchor="end" font-size="13.5" fill="var(--ed-secondary)">图表重绘与换色</text>
      <path class="draw-stroke" d="M 174 168 Q 245 166, 318 168" fill="none" stroke="var(--ed-blue)" stroke-width="2.6" stroke-linecap="round" filter="url(#chalk-texture)" />
      <circle cx="318" cy="168" r="6" fill="var(--ed-bg)" stroke="var(--ed-muted)" stroke-width="2" />
      <circle cx="174" cy="168" r="6.5" fill="var(--ed-blue)" />
      <text x="330" y="172" font-size="11.5" fill="var(--ed-muted)" font-family="ui-monospace, Menlo, monospace">85m</text>
      <text x="174" y="154" text-anchor="middle" font-size="11" fill="var(--ed-blue)" font-family="ui-monospace, Menlo, monospace" font-weight="700">12m</text>
    </g>
    <g class="dumbbell-gap__row">
      <text x="136" y="220" text-anchor="end" font-size="13.5" fill="var(--ed-secondary)">现场投影边界排查</text>
      <path class="draw-stroke" d="M 160 216 Q 210 214, 256 216" fill="none" stroke="var(--ed-blue)" stroke-width="2.6" stroke-linecap="round" filter="url(#chalk-texture)" />
      <circle cx="256" cy="216" r="6" fill="var(--ed-bg)" stroke="var(--ed-muted)" stroke-width="2" />
      <circle cx="160" cy="216" r="6.5" fill="var(--ed-blue)" />
      <text x="268" y="220" font-size="11.5" fill="var(--ed-muted)" font-family="ui-monospace, Menlo, monospace">52m</text>
      <text x="160" y="202" text-anchor="middle" font-size="11" fill="var(--ed-blue)" font-family="ui-monospace, Menlo, monospace" font-weight="700">4m</text>
    </g>
  </svg>
</figure>

<script>
  function animateDumbbellGap(timeline, root, position) {
    timeline.from(root.querySelectorAll('.dumbbell-gap__row'), { autoAlpha: 0, x: -14, stagger: 0.1, duration: 0.4, ease: 'power2.out' }, position);
  }
</script>
