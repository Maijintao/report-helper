<svg style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none" aria-hidden="true">
  <defs>
    <filter id="chalk-texture" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
</svg>

<style>
  .slopegraph {
    --ed-ink: #1C1A17;
    --ed-secondary: #565047;
    --ed-muted: #867E73;
    --ed-rule-strong: rgba(28, 26, 23, 0.78);
    --ed-red: #E05A47;
    color: var(--ed-ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }
  .slopegraph__svg { width: 100%; height: auto; display: block; }
  .slopegraph__series { cursor: pointer; transition: opacity 0.2s ease; }
  .slopegraph__svg:hover .slopegraph__series { opacity: 0.35; }
  .slopegraph__svg:hover .slopegraph__series:hover { opacity: 1; }
</style>

<figure class="slopegraph" style="margin:0">
  <svg class="slopegraph__svg" viewBox="0 0 400 248" role="img" aria-label="理解度跃迁斜率图示例">
    <line x1="110" y1="34" x2="110" y2="230" stroke="var(--ed-rule-strong)" stroke-width="1.2" />
    <line x1="290" y1="34" x2="290" y2="230" stroke="var(--ed-rule-strong)" stroke-width="1.2" />
    <text x="110" y="20" text-anchor="middle" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="var(--ed-muted)">Q1 旧版</text>
    <text x="290" y="20" text-anchor="middle" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="var(--ed-ink)" font-weight="700">Q4 杂志版</text>

    <g class="slopegraph__series">
      <path d="M 110 82 Q 200 76, 290 70" fill="none" stroke="var(--ed-muted)" stroke-width="1.6" opacity="0.55" />
      <circle cx="110" cy="82" r="4" fill="var(--ed-muted)" />
      <circle cx="290" cy="70" r="4" fill="var(--ed-muted)" />
      <text x="98" y="86" text-anchor="end" font-size="12" fill="var(--ed-muted)">代码架构 76</text>
      <text x="302" y="74" font-size="12" fill="var(--ed-secondary)">82</text>
    </g>
    <g class="slopegraph__series">
      <path d="M 110 124 Q 200 120, 290 116" fill="none" stroke="var(--ed-muted)" stroke-width="1.6" opacity="0.55" />
      <circle cx="110" cy="124" r="4" fill="var(--ed-muted)" />
      <circle cx="290" cy="116" r="4" fill="var(--ed-muted)" />
      <text x="98" y="128" text-anchor="end" font-size="12" fill="var(--ed-muted)">项目背景 64</text>
      <text x="302" y="120" font-size="12" fill="var(--ed-secondary)">68</text>
    </g>
    <g class="slopegraph__series">
      <path d="M 110 162 Q 200 156, 290 148" fill="none" stroke="var(--ed-muted)" stroke-width="1.6" opacity="0.55" />
      <circle cx="110" cy="162" r="4" fill="var(--ed-muted)" />
      <circle cx="290" cy="148" r="4" fill="var(--ed-muted)" />
      <text x="98" y="166" text-anchor="end" font-size="12" fill="var(--ed-muted)">风险复盘 52</text>
      <text x="302" y="152" font-size="12" fill="var(--ed-secondary)">57</text>
    </g>
    <g class="slopegraph__series">
      <path class="draw-stroke" d="M 110 198 Q 202 126, 290 48" fill="none" stroke="var(--ed-red)" stroke-width="3.2" stroke-linecap="round" filter="url(#chalk-texture)" />
      <circle cx="110" cy="198" r="5.5" fill="var(--ed-red)" />
      <circle cx="290" cy="48" r="6.5" fill="var(--ed-red)" />
      <text x="98" y="202" text-anchor="end" font-size="12.5" fill="var(--ed-red)" font-weight="700">核心结论 41</text>
      <text x="302" y="52" font-size="13.5" fill="var(--ed-red)" font-weight="800" font-family="ui-monospace, Menlo, monospace">94 (+53)</text>
      <text x="198" y="96" text-anchor="middle" font-size="13" fill="var(--ed-red)" font-family="'Kaiti SC', 'STKaiti', cursive">手绘聚焦带来最大跃升!</text>
    </g>
  </svg>
</figure>

<script>
  function animateSlopegraph(timeline, root, position) {
    timeline.from(root.querySelectorAll('.slopegraph__series'), { autoAlpha: 0, stagger: 0.1, duration: 0.4, ease: 'power2.out' }, position);
    const hero = root.querySelector('.draw-stroke');
    if (hero) {
      const len = hero.getTotalLength ? hero.getTotalLength() : 260;
      timeline.fromTo(hero, { strokeDasharray: len + 6, strokeDashoffset: len + 6 }, { strokeDashoffset: 0, duration: 0.7, ease: 'power2.out' }, '-=0.2');
    }
  }
</script>
