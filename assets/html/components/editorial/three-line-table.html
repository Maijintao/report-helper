<svg style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none" aria-hidden="true">
  <defs>
    <filter id="chalk-texture" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
</svg>

<style>
  .three-line-block {
    --ed-ink: #1C1A17;
    --ed-muted: #867E73;
    --ed-rule: rgba(28, 26, 23, 0.14);
    --ed-rule-strong: rgba(28, 26, 23, 0.78);
    --ed-red: #E05A47;
    --ed-green: #2E6F5E;
    display: grid;
    grid-template-columns: 1.35fr 0.85fr;
    gap: 36px;
    align-items: center;
    color: var(--ed-ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }
  .three-line-table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  .three-line-table th { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; text-transform: uppercase; color: var(--ed-muted); text-align: left; padding: 11px 8px; border-top: 2px solid var(--ed-rule-strong); border-bottom: 1px solid var(--ed-rule-strong); }
  .three-line-table td { padding: 14px 8px; border-bottom: 1px solid var(--ed-rule); }
  .three-line-table tbody tr:last-child td { border-bottom: 2px solid var(--ed-rule-strong); }
  .three-line-circle { position: relative; display: inline-block; padding: 0 6px; font-family: ui-monospace, Menlo, monospace; font-weight: 700; color: var(--ed-red); }
  .three-line-circle svg { position: absolute; left: -14%; top: -26%; width: 128%; height: 152%; pointer-events: none; overflow: visible; }
  .pull-quote-block { padding: 8px 0 8px 24px; border-left: 3px solid var(--ed-red); }
  .pull-quote-block blockquote { margin: 0 0 12px; font-family: "Songti SC", "Noto Serif SC", Georgia, serif; font-size: 21px; line-height: 1.55; }
  .pull-quote-block cite { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; font-style: normal; color: var(--ed-muted); }
  @media (max-width: 48rem) { .three-line-block { grid-template-columns: 1fr; } }
</style>

<div class="three-line-block" aria-label="学术三线表与拉引金句示例">
  <table class="three-line-table">
    <thead>
      <tr><th>方案架构</th><th>离线可用</th><th>手绘质感</th><th>首屏体积</th></tr>
    </thead>
    <tbody>
      <tr><td>传统 PPT 导出 HTML</td><td>依赖字体</td><td>生硬预设</td><td style="font-family:ui-monospace,Menlo,monospace">4.8 MB</td></tr>
      <tr><td>常规仪表盘风</td><td>单文件可行</td><td>同质化高</td><td style="font-family:ui-monospace,Menlo,monospace">1.2 MB</td></tr>
      <tr>
        <td><strong>杂志手绘风</strong></td>
        <td style="color:var(--ed-green);font-weight:700">100% 离线</td>
        <td style="color:var(--ed-red);font-weight:700">粉笔颗粒</td>
        <td>
          <span class="three-line-circle">
            &lt; 95 KB
            <svg viewBox="0 0 130 56" preserveAspectRatio="none" aria-hidden="true">
              <path class="draw-stroke" d="M 18 14 C 48 4, 102 5, 118 22 C 126 35, 108 49, 64 49 C 22 49, 8 38, 12 24 C 16 12, 46 9, 76 11" fill="none" stroke="var(--ed-red)" stroke-width="2.4" stroke-linecap="round" filter="url(#chalk-texture)" />
            </svg>
          </span>
        </td>
      </tr>
    </tbody>
  </table>
  <div class="pull-quote-block">
    <blockquote>“去掉多余的卡片边框，把空间还给文字、数据与那一笔恰到好处的朱砂红。”</blockquote>
    <cite>— REPORT VISUAL ARCHITECT</cite>
  </div>
</div>

<script>
  function animateThreeLineTable(timeline, root, position) {
    timeline.from(root.querySelectorAll('tbody tr, .pull-quote-block'), { autoAlpha: 0, y: 14, stagger: 0.1, duration: 0.45, ease: 'power2.out' }, position);
    const stroke = root.querySelector('.draw-stroke');
    if (stroke) {
      const len = stroke.getTotalLength ? stroke.getTotalLength() : 280;
      timeline.fromTo(stroke, { strokeDasharray: len + 6, strokeDashoffset: len + 6 }, { strokeDashoffset: 0, duration: 0.65, ease: 'power2.out' }, '-=0.2');
    }
  }
</script>
